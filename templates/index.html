<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriYield Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-section {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: white;
            padding: 30px;
            border-radius: 25px 25px 0 0;
            text-align: center;
        }

        .form-label { font-weight: 600; color: #333; margin-top: 10px; }

        .custom-input {
            border-radius: 10px;
            border: 1.5px solid #ddd;
            padding: 10px;
            width: 100%;
        }

        .btn-predict {
            background: #2e7d32;
            color: white;
            font-weight: bold;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            transition: 0.3s;
            border: none;
            width: 100%;
            margin-top: 25px;
        }

        .btn-predict:hover {
            background: #1b5e20;
            transform: translateY(-2px);
            color: white;
        }

        .result-box {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 15px;
            border-left: 8px solid #2e7d32;
            margin-top: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
            <div class="card glass-card">
                <div class="header-section">
                    <h3>🌾 AgriYield Predictor</h3>
                    <p class="mb-0">Smart Prediction for Better Farming</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    
                    <form action="/predict" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nitrogen (N)</label>
                                <input type="number" name="Nitrogen" class="custom-input" step="any" value="{{ n_val }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phosphorus (P)</label>
                                <input type="number" name="Phosphorus" class="custom-input" step="any" value="{{ p_val }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Potassium (K)</label>
                                <input type="number" name="Potassium" class="custom-input" step="any" value="{{ k_val }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Temperature (°C)</label>
                                <input type="number" name="Temperature" class="custom-input" step="any" value="{{ temp_val }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Soil pH</label>
                                <input type="number" name="pH" class="custom-input" step="any" value="{{ ph_val }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rainfall (mm)</label>
                                <input type="number" name="Rainfall" class="custom-input" step="any" value="{{ rain_val }}" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-predict">GET PREDICTION</button>
                    </form>

                    {% if prediction_text %}
                        <div class="result-box">
                            <h2 class="text-success">{{ prediction_text }}</h2>
                        </div>
                    {% endif %}

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
